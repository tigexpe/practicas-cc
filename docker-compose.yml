services:
  gateway:
    build: ./services/gateway
    ports:
      - "8000:8000"
    environment:
      SHORTENER_URL: http://shortener:8001
      REDIRECT_URL: http://redirect:8002
      ANALYTICS_URL: http://analytics:8003
    depends_on: [shortener, redirect, analytics]
    restart: unless-stopped

  shortener:
    build: ./services/shortener
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/shortener
      REDIS_URL: redis://redis:6379/0
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  redirect:
    build: ./services/redirect
    environment:
      SHORTENER_URL: http://shortener:8001
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    # Escalable horizontalmente: docker compose up --scale redirect=3

  analytics:
    build: ./services/analytics
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/analytics
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: shortener
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d shortener"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
